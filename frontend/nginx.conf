server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    # Only exercised when the frontend bundle was built without REACT_APP_API_URL (i.e. relative
    # "/api" base) — the case for local `docker compose up`. Production sets REACT_APP_API_URL to
    # the absolute Cloud Run backend URL at build time (see .github/workflows/ci-cd.yml), so the
    # built bundle never requests a relative /api path there and this block is inert in prod.
    location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
