server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    # Only exercised when the frontend bundle was built without REACT_APP_API_URL (i.e. relative
    # "/api" base) — the case for local `docker compose up`. Production sets REACT_APP_API_URL to
    # the absolute Cloud Run backend URL at build time (see .github/workflows/ci-cd.yml), so the
    # built bundle never requests a relative /api path there and this block is inert in prod.
    #
    # proxy_pass target MUST be a variable, not a literal hostname: a literal "backend" hostname
    # is resolved once at nginx startup, and nginx refuses to start if it can't resolve — which
    # crashed the container in Cloud Run (no "backend" host there; frontend/backend are separate
    # standalone services, not docker-compose containers on a shared network). Using a variable
    # defers resolution to request time via `resolver`, so startup never depends on it — this
    # location is simply never requested in Cloud Run anyway.
    #
    # proxy_pass here has NO trailing URI (just $api_upstream): nginx's usual location-prefix
    # splicing (matched prefix stripped, remainder appended to proxy_pass's URI) only happens for
    # a literal proxy_pass URI — once a variable is involved that splicing is disabled, so a
    # trailing "/api/" here would forward every request to the literal path "/api/" regardless of
    # what was actually requested. Omitting the URI makes nginx forward the original request URI
    # unchanged instead, which is correct here since every backend controller's own
    # @RequestMapping already includes "/api".
    resolver 127.0.0.11 ipv6=off valid=10s;
    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
